# Example only - do not commit real credentials. Create the real Secret with:
#   kubectl create secret generic nestjs-playground-db \
#     --from-literal=DB_USER=appuser --from-literal=DB_PASSWORD='<password>'
# or source it from a secret manager (External Secrets, Sealed Secrets, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: nestjs-playground-db
  labels:
    app.kubernetes.io/name: nestjs-playground
type: Opaque
stringData:
  DB_USER: appuser
  DB_PASSWORD: change-me
