apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-playground
  labels:
    app.kubernetes.io/name: nestjs-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nestjs-playground
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nestjs-playground
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in node:*-alpine
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nestjs-playground:latest # replace with your registry/image:tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: nestjs-playground-config
            - secretRef:
                name: nestjs-playground-db
          # Readiness checks the DB; liveness doesn't, so a DB outage takes
          # pods out of rotation instead of restarting them.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
