
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: players
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d players"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/chrisp1985/nestjs-playground:sha-b2490253781894f10fde992c275fc0d04742e541
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: players
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
