
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: players
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: players
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d players"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy_data:
  caddy_config:
