services:
  postgres:
    image: postgres:17
    container_name: nestjs-playground-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: players
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d players"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
